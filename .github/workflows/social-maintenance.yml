name: Social maintenance

# Dispara /api/jobs/social-maintenance cada hora. Vivía como cron de
# vercel.json, pero el plan actual de Vercel no permite frecuencia horaria;
# el disparo se movió aquí. Toda la lógica sigue viviendo exclusivamente en
# el endpoint — este workflow sólo hace la request HTTPS.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  trigger:
    name: llamar social-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verificar secret CRON_SECRET
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Falta el secret CRON_SECRET. Configúralo en Settings → Secrets and variables → Actions con el mismo valor que en Vercel Environment Variables."
            exit 1
          fi

      - name: Llamar /api/jobs/social-maintenance
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        # No usamos `curl -f`: eso sólo falla en >=400, y un redirect (3xx,
        # p.ej. si el middleware volviera a exigir sesión aquí) es <400 y
        # pasaría como "éxito" con el body "Redirecting..." — justo lo que
        # ya ocurrió una vez en producción. Aquí exigimos EXPLÍCITAMENTE
        # HTTP 200 + JSON válido + `ok: true`; cualquier otra cosa (redirect,
        # 401, 207, JSON inválido, `ok: false`) hace fallar el job.
        run: |
          set -uo pipefail

          response=$(curl --silent --show-error \
            --max-time 60 \
            --connect-timeout 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -w '\nHTTP_STATUS:%{http_code}' \
            "https://cpp-ceti.vercel.app/api/jobs/social-maintenance")

          http_status=$(printf '%s' "$response" | grep -o 'HTTP_STATUS:[0-9]*$' | cut -d: -f2)
          body=$(printf '%s' "$response" | sed 's/HTTP_STATUS:[0-9]*$//')

          echo "HTTP status: $http_status"
          echo "Body: $body"

          if [ "$http_status" != "200" ]; then
            echo "::error::Esperaba HTTP 200 y llegó $http_status (redirect, 401, 207 u otro código no cuentan como éxito)."
            exit 1
          fi

          if ! ok=$(printf '%s' "$body" | jq -er '.ok'); then
            echo "::error::La respuesta no es JSON válido con \`ok: true\`: $body"
            exit 1
          fi

          if [ "$ok" != "true" ]; then
            echo "::error::El job respondió ok=false: $body"
            exit 1
          fi
